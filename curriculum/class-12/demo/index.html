<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <!-- Tabs de navegación -->
        <ul class="nav nav-tabs" id="mainTabs" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="tab" href="#products">Productos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#customers">Clientes</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#sales">Ventas</a>
            </li>
        </ul>

        <!-- Contenido de los tabs -->
        <div class="tab-content mt-3">
            <!-- Tab Productos -->
            <div class="tab-pane fade show active" id="products">
                <div class="table-container">
                    <div class="toolbar d-flex justify-content-between align-items-center my-3">
                        <input type="search" 
                               class="form-control w-25" 
                               data-table="productsTable"
                               placeholder="Buscar productos...">
                        
                        <button class="btn btn-primary" 
                                data-bs-toggle="offcanvas" 
                                data-bs-target="#productForm">
                            Nuevo Producto
                        </button>
                    </div>

                    <table class="table" id="productsTable">
                        <thead>
                            <tr>
                                <th data-sort="name">Nombre</th>
                                <th data-sort="price">Precio</th>
                                <th data-sort="stock">Stock</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- Contenido similar para Clientes y Ventas -->
            <!-- ... -->
        </div>
    </div>

    <!-- Offcanvas Producto -->
    <div class="offcanvas offcanvas-end" id="productForm">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Nuevo Producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <form id="productFormContent">
                <input type="hidden" name="id">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Precio</label>
                    <input type="number" class="form-control" name="price" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" class="form-control" name="stock" required>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/models/Product.js"></script>
    <script src="js/models/Customer.js"></script>
    <script src="js/models/Sale.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
